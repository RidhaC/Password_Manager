<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Create Account - Access Guardians</title>
<link rel="icon" href="/static/favicon.ico"/>
<link rel="stylesheet" href="/static/css/base.css"/>
<link rel="stylesheet" href="/static/css/create.css"/>
</head>
<body>
<div class="titlebar">
  <img src="/static/logo_transparent.png"/>
  <span>Access Guardians</span>
</div>
<div class="page">
  <div class="create-wrap">

    <div class="brand">
      <div class="brand-icon" style="background:none;box-shadow:none;padding:0">
        <img src="/static/logo_transparent.png" width="72" height="72" style="object-fit:contain"/>
      </div>
      <h1>Create Account</h1>
      <p>Set up your secure local vault</p>
    </div>

    <div class="card">
      <div class="err-banner" id="err"></div>

      <div>
        <label class="field-label">Username</label>
        <input class="input" type="text" id="username" placeholder="Choose a username" autocomplete="off"/>
      </div>

      <div>
        <label class="field-label">Password</label>
        <div style="position:relative">
          <input class="input" type="password" id="password" placeholder="Min 16 chars, upper, lower, symbol" oninput="checkStrength()" style="padding-right:44px"/>
          <button class="btn-icon" onclick="toggleCreatePw('password', this)" style="position:absolute;right:6px;top:50%;transform:translateY(-50%)" title="Show password">👁</button>
        </div>
        <div class="strength-track"><div class="strength-fill" id="sbar"></div></div>
        <div class="strength-label" id="stext">Strength: —</div>
      </div>

      <div>
        <label class="field-label">Confirm Password</label>
        <div style="position:relative">
          <input class="input" type="password" id="confirm" placeholder="Re-enter password" style="padding-right:44px"/>
          <button class="btn-icon" onclick="toggleCreatePw('confirm', this)" style="position:absolute;right:6px;top:50%;transform:translateY(-50%)" title="Show password">👁</button>
        </div>
      </div>

      <div>
        <label class="field-label">Generate Strong Password</label>
        <div class="gen-row">
          <input class="gen-len" type="number" id="genlen" value="20" min="16" max="64"/>
          <button class="btn btn-ghost" onclick="genPassword()">Generate</button>
        </div>
      </div>

      <button class="btn btn-primary btn-full" onclick="doCreate()">Create Account</button>
      <button class="link-btn" onclick="location.href='/login'" style="display:flex;align-items:center;justify-content:center;gap:6px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Login
      </button>
    </div>
  </div>
</div>

<div class="modal" id="qrModal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Set Up Two-Factor Auth</h2>
      <p>Scan the QR code with Google Authenticator or Authy</p>
    </div>
    <div class="modal-body" style="align-items:center;text-align:center">
      <img class="qr-img" id="qrImg" src="" width="180" height="180" alt="QR Code"/>
      <p style="font-size:0.83rem;color:var(--text2)">Enter the 6-digit code to confirm setup</p>
      <input class="otp-input" id="setupCode" maxlength="6" placeholder="000000"/>
      <div style="font-size:0.82rem;color:var(--danger);min-height:18px" id="setupStatus"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="verify2FA()">Verify & Complete</button>
    </div>
  </div>
</div>

<div class="modal" id="backupModal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Save Your Backup Codes</h2>
      <p>Each code can only be used once. Store them somewhere safe</p>
    </div>
    <div class="modal-body">
      <div class="codes-grid" id="codesGrid"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="saveCodes()">Save to File</button>
      <button class="btn btn-success" onclick="location.href='/login'">Done →</button>
    </div>
  </div>
</div>

<script src="/static/js/create.js"></script>
</body>
</html>
