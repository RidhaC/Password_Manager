<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Access Guardians</title>
<link rel="icon" href="/static/favicon.ico"/>
<link rel="stylesheet" href="/static/css/base.css"/>
<link rel="stylesheet" href="/static/css/login.css"/>
</head>
<body>
<div class="titlebar">
  <img src="/static/logo_transparent.png"/>
  <span>Access Guardians</span>
</div>
<div class="page">
  <div class="login-wrap">

    <div class="brand">
      <div class="brand-icon" style="background:none;box-shadow:none;padding:0">
        <img src="/static/logo_transparent.png" width="72" height="72" style="object-fit:contain"/>
      </div>
      <h1>Access Guardians</h1>
      <p>Your passwords, secured locally</p>
    </div>

    <div class="card">
      <div class="err-banner" id="err"></div>

      <div>
        <label class="field-label">Username/Email</label>
        <input class="input" type="text" id="username" placeholder="Enter your username or email" autocomplete="off"/>
      </div>

      <div>
        <label class="field-label">Password</label>
        <div style="position:relative">
          <input class="input" type="password" id="password" placeholder="Enter your password" style="padding-right:44px"/>
          <button class="btn-icon" onclick="toggleLoginPw(this)" style="position:absolute;right:6px;top:50%;transform:translateY(-50%)" title="Show password">👁</button>
        </div>
      </div>

      <button class="btn btn-primary btn-full" onclick="doLogin()">Sign In</button>

      <div style="height:1px;background:var(--border)"></div>

      <button class="link-btn" onclick="location.href='/create-account'" style="display:flex;align-items:center;justify-content:center;gap:6px">
        Don't have an account? Create one
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

  </div>
</div>

<div class="otp-overlay" id="otpOverlay">
  <div class="otp-box">
    <div class="otp-icon">🔐</div>
    <h2>Two-Factor Authentication</h2>
    <p>Enter your 6-digit code from your authenticator app, or use a backup code</p>
    <input class="otp-input" id="otpCode" maxlength="12" placeholder="000000" autocomplete="off"/>
    <div class="otp-status" id="otpStatus"></div>
    <div class="otp-actions">
      <button class="btn btn-primary btn-full" onclick="verifyOTP(false)">Verify Code</button>
      <button class="btn btn-ghost btn-full" onclick="verifyOTP(true)">Use Backup Code</button>
      <button class="btn btn-danger btn-full" onclick="document.getElementById('otpOverlay').classList.remove('active')">Cancel</button>
    </div>
  </div>
</div>

<script src="/static/js/login.js"></script>
</body>
</html>
