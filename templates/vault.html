<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vault - Access Guardians</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#0d1117; --surface:#161b22; --surface2:#21262d; --border:#30363d;
    --accent:#00ff9d; --blue:#388bfd; --danger:#f85149; --warning:#d29922;
    --success:#3fb950; --text:#e6edf3; --muted:#7d8590;
    --mono:'Space Mono',monospace; --sans:'Inter',sans-serif;
  }
  html,body { height:100%; background:var(--bg); color:var(--text); font-family:var(--sans); overflow:hidden; }

  /* Layout */
  .layout { display:grid; grid-template-columns:280px 1fr; height:100vh; }

  /* Sidebar */
  .sidebar {
    background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .sidebar-header { padding:1.25rem 1rem; border-bottom:1px solid var(--border); }
  .sidebar-logo { font-family:var(--mono); font-size:0.7rem; color:var(--accent); letter-spacing:0.2em; display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .logo-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 6px var(--accent); }
  .sidebar-user { font-size:0.8rem; color:var(--muted); font-family:var(--mono); }

  .search-wrap { padding:0.75rem 1rem; border-bottom:1px solid var(--border); }
  .search-wrap input {
    width:100%; height:34px; background:var(--surface2);
    border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:var(--mono); font-size:0.78rem;
    padding:0 10px; outline:none; transition:border-color 0.2s;
  }
  .search-wrap input:focus { border-color:var(--blue); }

  .vault-list { flex:1; overflow-y:auto; padding:0.5rem; }
  .vault-list::-webkit-scrollbar { width:4px; }
  .vault-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  .entry-item {
    display:flex; align-items:center; gap:10px;
    padding:10px 10px; border-radius:8px; cursor:pointer;
    transition:background 0.15s; border:1px solid transparent;
    margin-bottom:3px;
  }
  .entry-item:hover { background:var(--surface2); }
  .entry-item.active { background:var(--surface2); border-color:var(--border); }
  .entry-icon {
    width:34px; height:34px; border-radius:8px;
    background:var(--surface2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:0.75rem; color:var(--accent);
    flex-shrink:0;
  }
  .entry-info { min-width:0; }
  .entry-label { font-size:0.88rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .entry-user  { font-size:0.73rem; color:var(--muted); font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .sidebar-footer { padding:0.75rem 1rem; border-top:1px solid var(--border); display:flex; gap:8px; }
  .sb-btn { flex:1; height:32px; border:none; border-radius:6px; font-family:var(--mono); font-size:0.68rem; letter-spacing:0.05em; cursor:pointer; transition:all 0.2s; }
  .sb-btn-add { background:var(--blue); color:#fff; }
  .sb-btn-add:hover { background:#2f6fd0; }
  .sb-btn-alerts { background:var(--surface2); color:var(--muted); border:1px solid var(--border); }
  .sb-btn-alerts:hover { color:var(--text); }
  .sb-btn-logout { background:rgba(248,81,73,0.08); color:var(--danger); border:1px solid rgba(248,81,73,0.2); }
  .sb-btn-logout:hover { background:rgba(248,81,73,0.15); }

  /* Main detail panel */
  .main { display:flex; flex-direction:column; overflow:hidden; background:var(--bg); }
  .detail-empty {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px;
  }
  .detail-empty .icon { font-size:2.5rem; opacity:0.2; }
  .detail-empty p { font-family:var(--mono); font-size:0.78rem; color:var(--muted); letter-spacing:0.1em; }

  .detail-panel { flex:1; overflow-y:auto; padding:2rem; display:none; }
  .detail-panel.active { display:block; }
  .detail-panel::-webkit-scrollbar { width:4px; }
  .detail-panel::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  .detail-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:2rem; }
  .detail-title { font-size:1.4rem; font-weight:600; }
  .detail-actions { display:flex; gap:8px; }
  .da-btn { height:34px; padding:0 14px; border-radius:6px; font-family:var(--mono); font-size:0.72rem; cursor:pointer; border:none; transition:all 0.2s; }
  .da-edit   { background:var(--surface2); color:var(--blue); border:1px solid var(--border); }
  .da-edit:hover { border-color:var(--blue); }
  .da-delete { background:rgba(248,81,73,0.08); color:var(--danger); border:1px solid rgba(248,81,73,0.2); }
  .da-delete:hover { background:rgba(248,81,73,0.15); }

  .field-block { margin-bottom:1.25rem; }
  .field-block label { font-family:var(--mono); font-size:0.62rem; letter-spacing:0.15em; color:var(--muted); display:block; margin-bottom:6px; }
  .field-value {
    background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:10px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .field-value span { font-family:var(--mono); font-size:0.85rem; color:var(--text); word-break:break-all; }
  .field-value .pw-hidden { letter-spacing:0.2em; color:var(--muted); }
  .copy-btn {
    flex-shrink:0; height:26px; padding:0 10px;
    background:var(--surface2); color:var(--muted);
    border:1px solid var(--border); border-radius:5px;
    font-family:var(--mono); font-size:0.65rem; cursor:pointer; transition:all 0.2s;
  }
  .copy-btn:hover { color:var(--accent); border-color:var(--accent); }
  .show-btn {
    flex-shrink:0; height:26px; padding:0 10px;
    background:var(--surface2); color:var(--muted);
    border:1px solid var(--border); border-radius:5px;
    font-family:var(--mono); font-size:0.65rem; cursor:pointer; transition:all 0.2s;
  }
  .show-btn:hover { color:var(--text); }

  /* Modal */
  .modal { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; }
  .modal.active { display:flex; }
  .modal-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; width:460px; max-width:95vw; max-height:90vh; overflow:hidden; display:flex; flex-direction:column; }
  .modal-header { background:var(--surface2); padding:1rem 1.5rem; border-bottom:1px solid var(--border); flex-shrink:0; }
  .modal-header h2 { font-size:1rem; font-weight:600; }
  .modal-scroll { overflow-y:auto; padding:1.25rem 1.5rem; flex:1; display:flex; flex-direction:column; gap:0.9rem; }
  .modal-scroll::-webkit-scrollbar { width:4px; }
  .modal-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .modal-footer { padding:1rem 1.5rem; border-top:1px solid var(--border); display:flex; gap:8px; flex-shrink:0; }
  .modal-footer .btn { flex:1; height:38px; border:none; border-radius:6px; font-family:var(--mono); font-size:0.75rem; cursor:pointer; transition:all 0.2s; }
  .btn-primary { background:var(--blue); color:#fff; }
  .btn-primary:hover { background:#2f6fd0; }
  .btn-cancel { background:var(--surface2); color:var(--muted); border:1px solid var(--border); }
  .btn-cancel:hover { color:var(--text); }
  .m-label { font-family:var(--mono); font-size:0.62rem; letter-spacing:0.13em; color:var(--muted); margin-bottom:5px; }
  .m-input {
    width:100%; height:38px; background:var(--surface2); border:1px solid var(--border);
    border-radius:6px; color:var(--text); font-family:var(--mono); font-size:0.82rem;
    padding:0 12px; outline:none; transition:border-color 0.2s;
  }
  .m-input:focus { border-color:var(--blue); }
  .m-textarea {
    width:100%; min-height:80px; background:var(--surface2); border:1px solid var(--border);
    border-radius:6px; color:var(--text); font-family:var(--mono); font-size:0.8rem;
    padding:10px 12px; outline:none; resize:vertical; transition:border-color 0.2s;
  }
  .m-textarea:focus { border-color:var(--blue); }
  .sbar-wrap { height:3px; background:var(--border); border-radius:2px; }
  .sbar-fill { height:100%; width:0; border-radius:2px; transition:width 0.3s,background 0.3s; }
  .stext { font-family:var(--mono); font-size:0.62rem; margin-top:4px; color:var(--muted); }
  .gen-row { display:flex; align-items:center; gap:8px; }
  .gen-row input[type=number] { width:65px; height:32px; background:var(--surface2); border:1px solid var(--border); border-radius:5px; color:var(--text); font-family:var(--mono); font-size:0.8rem; padding:0 8px; outline:none; }
  .btn-gen { height:32px; padding:0 12px; background:rgba(56,139,253,0.1); color:var(--blue); border:1px solid rgba(56,139,253,0.25); border-radius:5px; font-family:var(--mono); font-size:0.7rem; cursor:pointer; transition:all 0.2s; }
  .btn-gen:hover { background:rgba(56,139,253,0.2); }
  .pw-row { display:flex; gap:6px; }
  .pw-row .m-input { flex:1; }
  .pw-toggle { height:38px; padding:0 10px; background:var(--surface2); color:var(--muted); border:1px solid var(--border); border-radius:6px; font-family:var(--mono); font-size:0.68rem; cursor:pointer; white-space:nowrap; }
  .toast { position:fixed; bottom:24px; right:24px; background:var(--surface); border:1px solid var(--accent); border-radius:8px; color:var(--accent); font-family:var(--mono); font-size:0.78rem; padding:10px 16px; z-index:999; opacity:0; transform:translateY(8px); transition:all 0.25s; }
  .toast.show { opacity:1; transform:translateY(0); }
  .modal-status { font-family:var(--mono); font-size:0.75rem; min-height:16px; }

  /* Alerts panel */
  .alert-card { background:var(--surface); border-radius:8px; padding:14px 16px; display:flex; gap:12px; margin-bottom:10px; }
  .alert-stripe { width:3px; border-radius:2px; flex-shrink:0; }
  .alert-body { flex:1; }
  .alert-title { font-size:0.88rem; font-weight:500; margin-bottom:3px; }
  .alert-msg { font-size:0.78rem; color:var(--muted); }
</style>
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><span class="logo-dot"></span>ACCESS GUARDIANS</div>
      <div class="sidebar-user">{{ username }}</div>
    </div>

    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search passwords..." oninput="filterList()" />
    </div>

    <div class="vault-list" id="vaultList">
      <div style="font-family:var(--mono);font-size:0.72rem;color:var(--muted);padding:1rem;text-align:center">Loading...</div>
    </div>

    <div class="sidebar-footer">
      <button class="sb-btn sb-btn-add" onclick="openAdd()">+ Add</button>
      <button class="sb-btn sb-btn-alerts" onclick="showAlerts()">Alerts</button>
      <button class="sb-btn sb-btn-logout" onclick="location.href='/logout'">Logout</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="detail-empty" id="emptyState">
      <div class="icon">🔐</div>
      <p>SELECT AN ENTRY OR ADD NEW</p>
    </div>

    <div class="detail-panel" id="detailPanel">
      <div class="detail-header">
        <div class="detail-title" id="dTitle"></div>
        <div class="detail-actions">
          <button class="da-btn da-edit" onclick="openEdit()">Edit</button>
          <button class="da-btn da-delete" onclick="doDelete()">Delete</button>
        </div>
      </div>
      <div id="dFields"></div>
    </div>

    <div class="detail-panel" id="alertsPanel">
      <div class="detail-header">
        <div class="detail-title">Security Alerts</div>
        <button class="da-btn da-edit" onclick="showEmpty()">← Back</button>
      </div>
      <div id="alertsContent"></div>
    </div>
  </main>
</div>

<!-- Add/Edit Modal -->
<div class="modal" id="formModal">
  <div class="modal-card">
    <div class="modal-header"><h2 id="formTitle">Add Password</h2></div>
    <div class="modal-scroll">
      <div class="m-label">LABEL / WEBSITE</div>
      <input class="m-input" id="fLabel" placeholder="e.g. GitHub" autocomplete="off"/>

      <div class="m-label">ACCOUNT USERNAME</div>
      <input class="m-input" id="fUser" placeholder="username or email" autocomplete="off"/>

      <div class="m-label">PASSWORD</div>
      <div class="pw-row">
        <input class="m-input" id="fPass" type="password" placeholder="Enter or generate"/>
        <button class="pw-toggle" onclick="toggleFPass()">Show</button>
      </div>
      <div class="sbar-wrap"><div class="sbar-fill" id="fSbar"></div></div>
      <div class="stext" id="fStext">Strength: —</div>

      <div class="m-label" style="margin-top:6px">GENERATE PASSWORD</div>
      <div class="gen-row">
        <input type="number" id="fGenLen" value="20" min="16" max="64"/>
        <button class="btn-gen" onclick="genModalPassword()">Generate</button>
      </div>

      <div class="m-label">URL (optional)</div>
      <input class="m-input" id="fUrl" placeholder="https://..." autocomplete="off"/>

      <div class="m-label">NOTES (optional)</div>
      <textarea class="m-textarea" id="fNotes" placeholder="Any additional notes"></textarea>

      <div class="modal-status" id="formStatus"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="submitForm()">Save Entry</button>
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let secrets = [];
let current = null;
let editMode = false;

async function loadSecrets() {
  const res = await fetch('/api/secrets');
  secrets = await res.json();
  renderList(secrets);
}

function renderList(items) {
  const el = document.getElementById('vaultList');
  if (!items.length) {
    el.innerHTML = '<div style="font-family:var(--mono);font-size:0.72rem;color:var(--muted);padding:1rem;text-align:center">No entries yet</div>';
    return;
  }
  el.innerHTML = items.map((s, i) => `
    <div class="entry-item" onclick="selectEntry(${i})" id="ei-${i}">
      <div class="entry-icon">${s.label.slice(0,2).toUpperCase()}</div>
      <div class="entry-info">
        <div class="entry-label">${esc(s.label)}</div>
        <div class="entry-user">${esc(s.account_username)}</div>
      </div>
    </div>
  `).join('');
}

function filterList() {
  const q = document.getElementById('search').value.toLowerCase();
  renderList(secrets.filter(s => s.label.toLowerCase().includes(q) || s.account_username.toLowerCase().includes(q)));
}

function selectEntry(idx) {
  current = secrets[idx];
  document.querySelectorAll('.entry-item').forEach(e => e.classList.remove('active'));
  const el = document.getElementById(`ei-${idx}`);
  if (el) el.classList.add('active');
  showDetail(current);
}

function showDetail(s) {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('alertsPanel').classList.remove('active');
  const dp = document.getElementById('detailPanel');
  dp.classList.add('active');
  document.getElementById('dTitle').textContent = s.label;

  let pwVisible = false;
  document.getElementById('dFields').innerHTML = `
    ${fieldBlock('ACCOUNT USERNAME', s.account_username, true)}
    <div class="field-block">
      <label>PASSWORD</label>
      <div class="field-value">
        <span id="pwSpan" class="pw-hidden">••••••••••••</span>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="show-btn" id="showPwBtn" onclick="toggleDetailPw()">Show</button>
          <button class="copy-btn" onclick="copyText('${esc(s.password)}')">Copy</button>
        </div>
      </div>
    </div>
    ${s.url ? fieldBlock('URL', s.url, true) : ''}
    ${s.notes ? fieldBlock('NOTES', s.notes, false) : ''}
  `;

  window._currentPw = s.password;
  window.toggleDetailPw = function() {
    pwVisible = !pwVisible;
    document.getElementById('pwSpan').textContent = pwVisible ? window._currentPw : '••••••••••••';
    document.getElementById('pwSpan').className = pwVisible ? '' : 'pw-hidden';
    document.getElementById('showPwBtn').textContent = pwVisible ? 'Hide' : 'Show';
  };
}

function fieldBlock(label, value, copyable) {
  return `<div class="field-block">
    <label>${label}</label>
    <div class="field-value">
      <span>${esc(value)}</span>
      ${copyable ? `<button class="copy-btn" onclick="copyText('${esc(value)}')">Copy</button>` : ''}
    </div>
  </div>`;
}

function showEmpty() {
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('detailPanel').classList.remove('active');
  document.getElementById('alertsPanel').classList.remove('active');
  current = null;
}

// Add / Edit
function openAdd() {
  editMode = false;
  document.getElementById('formTitle').textContent = 'Add Password';
  document.getElementById('fLabel').value = '';
  document.getElementById('fUser').value = '';
  document.getElementById('fPass').value = '';
  document.getElementById('fUrl').value = '';
  document.getElementById('fNotes').value = '';
  document.getElementById('formStatus').textContent = '';
  document.getElementById('fSbar').style.width = '0';
  document.getElementById('fStext').textContent = 'Strength: —';
  document.getElementById('fLabel').removeAttribute('readonly');
  document.getElementById('formModal').classList.add('active');
  document.getElementById('fLabel').focus();
}

function openEdit() {
  if (!current) return;
  editMode = true;
  document.getElementById('formTitle').textContent = 'Edit Entry';
  document.getElementById('fLabel').value = current.label;
  document.getElementById('fLabel').setAttribute('readonly', true);
  document.getElementById('fUser').value = current.account_username;
  document.getElementById('fPass').value = current.password;
  document.getElementById('fPass').type = 'text';
  document.getElementById('fUrl').value = current.url || '';
  document.getElementById('fNotes').value = current.notes || '';
  document.getElementById('formStatus').textContent = '';
  checkModalStrength();
  document.getElementById('formModal').classList.add('active');
}

function closeModal() {
  document.getElementById('formModal').classList.remove('active');
}

function toggleFPass() {
  const inp = document.getElementById('fPass');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function checkModalStrength() {
  const pwd = document.getElementById('fPass').value;
  const bar = document.getElementById('fSbar');
  const txt = document.getElementById('fStext');
  if (!pwd) { bar.style.width='0'; txt.textContent='Strength: —'; txt.style.color='var(--muted)'; return; }
  let score = 0;
  if (pwd.length >= 16) score += 40; else if (pwd.length >= 12) score += 25; else score += pwd.length * 2;
  if (/[a-z]/.test(pwd)) score += 10;
  if (/[A-Z]/.test(pwd)) score += 10;
  if (/[0-9]/.test(pwd)) score += 10;
  if (/[^a-zA-Z0-9]/.test(pwd)) score += 15;
  if (new Set(pwd).size > 10) score += 10;
  score = Math.min(score, 99);
  const lbl = score < 40 ? 'Weak' : score < 70 ? 'Medium' : 'Strong';
  const col = score < 40 ? 'var(--danger)' : score < 70 ? 'var(--warning)' : 'var(--success)';
  bar.style.width = score + '%'; bar.style.background = col;
  txt.textContent = `Strength: ${lbl} (${score}%)`; txt.style.color = col;
}
document.getElementById('fPass').addEventListener('input', checkModalStrength);

function genModalPassword() {
  const len = Math.max(16, parseInt(document.getElementById('fGenLen').value) || 20);
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]{}|;:,.<>?';
  let pwd = '';
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  for (let i = 0; i < len; i++) pwd += chars[arr[i] % chars.length];
  document.getElementById('fPass').value = pwd;
  document.getElementById('fPass').type = 'text';
  checkModalStrength();
}

async function submitForm() {
  const label = document.getElementById('fLabel').value.trim();
  const user  = document.getElementById('fUser').value.trim();
  const pass  = document.getElementById('fPass').value;
  const url   = document.getElementById('fUrl').value.trim();
  const notes = document.getElementById('fNotes').value.trim();
  const status = document.getElementById('formStatus');

  if (!label || !user || !pass) { status.textContent = 'Label, username and password required.'; status.style.color='var(--warning)'; return; }

  if (editMode) {
    const res = await fetch(`/api/secrets/0`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({old_label: current.label, account_username:user, password:pass, url, notes})
    });
    const d = await res.json();
    if (d.ok) { closeModal(); toast('Entry updated.'); loadSecrets(); }
    else { status.textContent = 'Update failed.'; status.style.color='var(--danger)'; }
  } else {
    const res = await fetch('/api/secrets', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({label, account_username:user, password:pass, url, notes})
    });
    const d = await res.json();
    if (d.ok) { closeModal(); toast('Entry saved.'); loadSecrets(); }
    else { status.textContent = 'Save failed.'; status.style.color='var(--danger)'; }
  }
}

async function doDelete() {
  if (!current) return;
  if (!confirm(`Delete "${current.label}"?`)) return;
  const res = await fetch('/api/secrets/delete', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({label: current.label})
  });
  const d = await res.json();
  if (d.ok) { showEmpty(); toast('Entry deleted.'); loadSecrets(); }
}

// Alerts
async function showAlerts() {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('detailPanel').classList.remove('active');
  document.getElementById('alertsPanel').classList.add('active');

  const res = await fetch('/api/secrets');
  const data = await res.json();
  const now = Date.now();
  const SIX_MONTHS = 180 * 24 * 60 * 60 * 1000;
  const content = document.getElementById('alertsContent');
  const seen = {};
  let html = '';

  data.forEach(s => {
    if (s.last_updated) {
      const dt = new Date(s.last_updated).getTime();
      if (now - dt > SIX_MONTHS) {
        html += alertCard('⏰', s.label, 'Password not updated in over 6 months.', 'var(--warning)');
      }
    }
    const pw = s.password;
    if (pw) { seen[pw] = seen[pw] || []; seen[pw].push(s.label); }
  });

  Object.values(seen).forEach(sites => {
    if (sites.length > 1)
      html += alertCard('⚠️', 'Duplicate Password', `Same password: ${sites.join(', ')}`, 'var(--danger)');
  });

  if (!html) html = alertCard('✅', 'All Clear', 'No issues found. All passwords are unique and up to date.', 'var(--success)');
  content.innerHTML = html;
}

function alertCard(icon, title, msg, color) {
  return `<div class="alert-card" style="border:1px solid ${color}30">
    <div class="alert-stripe" style="background:${color}"></div>
    <div class="alert-body">
      <div class="alert-title" style="color:${color}">${icon}  ${esc(title)}</div>
      <div class="alert-msg">${esc(msg)}</div>
    </div>
  </div>`;
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard'));
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

loadSecrets();
</script>
